<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alaskariannet - العتبة العسكرية المقدسة</title>

    <!-- أيقونة الموقع -->
    <link rel="icon" type="image/png" href="./assets/logo.png">

    <!-- الخطوط -->
    <link href="./assets/fonts.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="./assets/fontawesome.css">

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:flex-start;
            background-image:url('./assets/background.jpeg');
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
            padding:40px 0;
            position:relative;
        }

        body::before{
            content:"";
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.25);
            z-index:0;
        }

        .container{
            width:90%;
            max-width:480px;
            text-align:center;
            position:relative;
            z-index:1;
        }

        .profile-img{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:contain;
            background:#0A1931;
            border:4px solid #fff;
            padding:8px;
            box-shadow:0 10px 30px rgba(0,0,0,.4);
            margin-bottom:15px;
            animation:float 4s ease-in-out infinite;
        }

        .title-en{
            color:#fff;
            font-size:1.4rem;
            font-weight:700;
            letter-spacing:1px;
            margin-bottom:8px;
            text-shadow:0 2px 8px rgba(0,0,0,.6);
        }

        .subtitle-ar{
            font-family:'Cairo',sans-serif;
            color:#f1f1f1;
            font-size:1rem;
            font-weight:600;
            margin-bottom:35px;
            direction:rtl;
            text-shadow:0 2px 8px rgba(0,0,0,.6);
        }

        .link-btn{
            display:flex;
            align-items:center;
            justify-content:space-between;
            text-decoration:none;
            color:#111;
            background:rgba(255,255,255,.88);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
            border-radius:18px;
            padding:18px 22px;
            margin-bottom:16px;
            border:1px solid rgba(255,255,255,.3);
            box-shadow:0 8px 20px rgba(0,0,0,.15);
            transition:.4s;
            opacity:0;
            transform:translateY(30px);
            animation:fadeInUp .7s forwards;
        }

        .link-btn:hover{
            transform:translateY(-6px) scale(1.03);
            background:#fff;
            box-shadow:0 18px 35px rgba(0,0,0,.25);
        }

        .icon-left{
            width:40px;
            font-size:1.8rem;
            display:flex;
            justify-content:flex-start;
            align-items:center;
        }

        .text-center{
            flex:1;
            text-align:center;
            font-size:1.05rem;
            font-weight:600;
        }

        .icon-right{
            width:40px;
            display:flex;
            justify-content:flex-end;
            color:#888;
        }

        .fa-facebook{color:#1877F2;}
        .fa-telegram{color:#2AABEE;}
        .fa-youtube{color:#FF0000;}
        .fa-tiktok{color:#000;}
        .fa-x-twitter{color:#000;}

        .instagram-icon{
            background:linear-gradient(
                45deg,
                #f09433 0%,
                #e6683c 25%,
                #dc2743 50%,
                #cc2366 75%,
                #bc1888 100%
            );
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .custom-logo-icon{
            width:30px;
            height:30px;
            border-radius:50%;
            object-fit:contain;
            background:#0A1931;
            padding:2px;
        }

        @keyframes float{
            0%{transform:translateY(0);}
            50%{transform:translateY(-10px);}
            100%{transform:translateY(0);}
        }

        @keyframes fadeInUp{
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .link-btn:nth-child(1){animation-delay:.1s;}
        .link-btn:nth-child(2){animation-delay:.2s;}
        .link-btn:nth-child(3){animation-delay:.3s;}
        .link-btn:nth-child(4){animation-delay:.4s;}
        .link-btn:nth-child(5){animation-delay:.5s;}
        .link-btn:nth-child(6){animation-delay:.6s;}
        .link-btn:nth-child(7){animation-delay:.7s;}

        @media (min-width:768px){
            body{
                align-items:center;
            }
        }
        .public-language { position:absolute; inset-block-start:14px; inset-inline-end:18px; z-index:2; display:flex; align-items:center; gap:7px; padding:5px 9px; background:rgba(10,25,49,.65); color:#fff; border:1px solid #ffffff40; border-radius:8px; }
        .public-language select { font-family:'Cairo','Poppins',sans-serif; background:transparent; color:white; border:0; padding:4px; cursor:pointer; font-size:12px; }
        .public-language option { color:#153f35; background:white; }
        .public-language select:focus-visible { outline:2px solid #d8b977; outline-offset:3px; }
        .uploaded-link-icon { width:34px; height:34px; object-fit:contain; border-radius:7px; }
        html[dir="rtl"] .text-center { font-family:'Cairo','Poppins',sans-serif; }
        .is-preview .public-language { display:none; }
        .is-preview .uploaded-link-icon { width:24px; height:24px; }
        body:not(.is-preview) { padding-top:70px; }
        body[data-button-style="pill"] .link-btn { border-radius: 50px; }
        body[data-button-style="square"] .link-btn { border-radius: 4px; }
        .no-animation .profile-img, .no-animation .link-btn { animation: none; opacity: 1; transform: none; }
        .is-preview { padding: 30px 0; }
        html:has(.is-preview) { scrollbar-width: none; }
        html:has(.is-preview)::-webkit-scrollbar { display: none; }
        .is-preview .container { width: 86%; }
        .is-preview .profile-img { width: 78px; height: 78px; border-width: 2px; padding: 5px; margin-bottom: 9px; }
        .is-preview .title-en { font-size: 18px; letter-spacing: .3px; }
        .is-preview .subtitle-ar { font-size: 12px; margin-bottom: 22px; }
        .is-preview .link-btn { padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; }
        .is-preview .text-center { font-size: 12px; }
        .is-preview .icon-left { font-size: 19px; width: 26px; }
        .is-preview .icon-right { font-size: 11px; width: 26px; }
        @media (prefers-reduced-motion: reduce) {
            .profile-img, .link-btn { animation: none; opacity: 1; transform: none; transition: none; }
        }
    </style>
    <script type="module" src="./assets/public.js"></script>
</head>

<body>

<label class="public-language"><i class="fa-solid fa-language" aria-hidden="true"></i><select data-language-select aria-label="اللغة" data-i18n-aria-label="Language"><option value="ar" lang="ar">العربية</option><option value="en" lang="en">English</option></select></label>

    <a href="https://alaskarian.net/"

</body>
</html>
